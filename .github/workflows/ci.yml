name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Dead-code scan (advisory)
        # continue-on-error: findings are reported but do not break CI.
        # Triage: see knip.json for confirmed-FP allowlist rationale.
        # Confirmed dead (remove separately): scripts/time-ocr.ts, pdf-parse dep,
        #   isOpenRouterSttEnabled, isVertexSttEnabled, veridynOcrBearer,
        #   bearerFromRequest, normalizeBn (alias), dialectCueCatalog,
        #   extractCandidateFactsFromText, extension, tessDataPath,
        #   SttFallback, DialectCandidate, DialectInferenceStatus, DialectClassifierDetail.
        continue-on-error: true
        run: npx knip
